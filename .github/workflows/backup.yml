# Copia de seguridad diaria de la base de Supabase.
#
# Guarda la copia CIFRADA como "artifact" de esta ejecución (Actions → Backup de la base →
# la ejecución del día → Artifacts) durante 90 días. Sin la contraseña no se puede leer.
#
# Necesita dos secretos (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_DB_URL    Cadena de conexión "Session pooler" de Supabase (botón Connect),
#                      con la contraseña de la base puesta. Tiene que ser la del pooler:
#                      la conexión directa usa IPv6 y GitHub no llega.
#   BACKUP_PASSPHRASE  Una contraseña larga inventada para cifrar las copias. Guardarla
#                      también fuera de GitHub: sin ella las copias no se pueden abrir.
#
# Cómo restaurar: ver docs/DOCUMENTACION.md, sección "Copias de seguridad".
name: Backup de la base

on:
  schedule:
    - cron: '17 6 * * *'   # todos los días 03:17 de Argentina (06:17 UTC)
  workflow_dispatch:        # botón "Run workflow" para hacer una copia en el momento

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PG_VERSION: '17'   # versión de pg_dump: tiene que ser igual o más nueva que la de la base
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pg_dump
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq "postgresql-client-$PG_VERSION"
          echo "/usr/lib/postgresql/$PG_VERSION/bin" >> "$GITHUB_PATH"

      - name: Hacer la copia
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: scripts/backup.sh copia

      - name: Guardar la copia cifrada
        uses: actions/upload-artifact@v4
        with:
          name: backup-ruta38-${{ github.run_id }}
          path: copia/*.gpg
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
